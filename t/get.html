<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Get Pocket Tape</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1c1b19; color: #9c978d; font: 15px -apple-system, Helvetica, Arial, sans-serif; }
  a { color: #ee8f2a; }
</style>
</head>
<body>
<p>Opening the store… <a href="/" id="yedek">Continue</a></p>
<script>
  // Mağaza bağlantıları: uygulama yayına girince burayı doldur. Boşken ana sayfaya gider.
  const MAGAZA = {
    ios: "",     // https://apps.apple.com/app/idXXXXXXXXXX
    android: "", // https://play.google.com/store/apps/details?id=com.tgsmobileapps.pockettape
  };
  const istenen = location.hash.slice(1);
  const ua = navigator.userAgent;
  const cihaz = istenen in MAGAZA ? istenen
    : /android/i.test(ua) ? "android"
    : /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1) ? "ios"
    : "";
  const hedef = MAGAZA[cihaz] || "/";
  document.getElementById("yedek").href = hedef;
  location.replace(hedef);
</script>
</body>
</html>
